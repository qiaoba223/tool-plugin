name: Build & Release (Android APK + iOS IPA)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 发布 Release 需要写权限；仓库默认是只读，必须显式声明
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.5'
  APP_DIR: app

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 生成 Android 平台工程
        working-directory: ${{ env.APP_DIR }}
        run: flutter create --platforms=android --org com.qiaoba --project-name tool_plugin_app .

      - name: 修补平台配置
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/patch_platforms.py

      - name: 生成应用图标
        working-directory: ${{ env.APP_DIR }}
        run: |
          # macOS runner 的 Homebrew Python 是 externally-managed（PEP 668），
          # 直接 pip install 会被拒；旧版 pip 又不认 --break-system-packages。
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pillow \
            || python3 -m pip install --quiet --disable-pip-version-check --user pillow
          python3 tool/gen_icon.py

      # 本项目无原生源码，但 Flutter 模板会写 ndkVersion = flutter.ndkVersion，
      # 使 AGP 下载指定 NDK；runner 上偶发下到损坏包导致构建失败。
      # 优先复用 runner 预装的 NDK，探测不到则保持原样（仍允许下载）。
      - name: 复用预装 NDK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -uo pipefail
          VER=""
          for d in "${ANDROID_NDK_LATEST_HOME:-}" "${ANDROID_NDK_HOME:-}" "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/*; do
            [ -d "$d" ] || continue
            [ -f "$d/source.properties" ] || continue
            VER=$(sed -n 's/^Pkg\.Revision *= *//p' "$d/source.properties" | head -1)
            [ -n "$VER" ] && break
          done
          echo "预装 NDK 版本: ${VER:-未探测到}"
          if [ -n "$VER" ] && [ -f android/app/build.gradle.kts ]; then
            sed -i -E "s/ndkVersion[[:space:]]*=[[:space:]]*[^\n,)]+/ndkVersion = \"$VER\"/" android/app/build.gradle.kts
          fi
          grep -n ndkVersion android/app/build.gradle.kts || true

      - name: pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      # 复用 qiaoba-toolbox 的签名方式：keystore 由 secret 解码，
      # 口令经环境变量传给 Gradle（System.getenv），不落盘成 key.properties。
      # 签名来源优先级：仓库 secret > 仓库内 signing/ 目录。
      # 注意不能写成 if: secrets.xxx != ''——step 级 if 不支持 secrets 上下文，
      # 用了会让整个 workflow 被判定无效（不产生任何 job）。
      # keystore 随仓库分发（私有库），CI 自动解码并签名，无需配置任何 secret。
      - name: 准备签名
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          test -f signing/release.keystore.b64 || { echo "::error::缺少 signing/release.keystore.b64"; exit 1; }
          base64 -d < signing/release.keystore.b64 > android/app/release.keystore
          test -s android/app/release.keystore || { echo "::error::keystore 解码为空"; exit 1; }
          # 口令经环境变量交给 Gradle（System.getenv），不落盘成 key.properties
          {
            printf 'KEYSTORE_PASSWORD=%s\n' "$(cat signing/password.txt)"
            printf 'KEYSTORE_ALIAS=tool-plugin\n'
          } >> "$GITHUB_ENV"
          echo "签名已就绪：$(stat -c%s android/app/release.keystore) 字节"

      - name: build apk
        working-directory: ${{ env.APP_DIR }}
        run: |
          # tag 触发：v1.0.0 -> 1.0.0；手动触发：用提交短 SHA 作版本后缀
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${{ github.ref_name }}"; VER="${VER#v}"
          else
            VER="0.0.0+${GITHUB_SHA:0:7}"
          fi
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          flutter build apk --release --dart-define=APP_VERSION="$VER"

      - name: 重命名产物
        run: |
          mkdir -p dist
          APK="${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk"
          cp "$APK" "dist/tool-plugin-${APP_VERSION}.apk"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

      - name: Release (on tag)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # 复用同名 release 时，asset 会被覆盖但 published_at 不会刷新，
      # 界面上就会显示成上一次发布的时间。这里显式对齐到本次构建时间。
      - name: 刷新发布时间
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$ID" \
            -F published_at="$NOW" >/dev/null
          echo "release $TAG 发布时间已更新为 $NOW"

  build-ios:
    name: Build iOS IPA (unsigned, TrollStore compatible)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 与 qiaoba-toolbox 完全相同的工具链：Flutter 3.41.5（iOS 13+）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: 生成 iOS 平台工程
        working-directory: ${{ env.APP_DIR }}
        run: flutter create --platforms=ios --org com.qiaoba --project-name tool_plugin_app .

      # 同理：先恢复我方 Podfile，再由补丁脚本统一钉死部署目标
      - name: 恢复我方 Podfile
        run: git checkout -- ${{ env.APP_DIR }}/ios/Podfile || true

      - name: 修补平台配置
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/patch_platforms.py

      - name: 生成应用图标
        working-directory: ${{ env.APP_DIR }}
        run: |
          # macOS runner 的 Homebrew Python 是 externally-managed（PEP 668），
          # 直接 pip install 会被拒；旧版 pip 又不认 --break-system-packages。
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pillow \
            || python3 -m pip install --quiet --disable-pip-version-check --user pillow
          python3 tool/gen_icon.py

      - name: pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: 复核 iOS 部署目标
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "--- Podfile ---"
          grep -n "platform :ios" ios/Podfile
          echo "--- pbxproj ---"
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 13.0;" ios/Runner.xcodeproj/project.pbxproj
          echo "--- Info.plist ---"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" ios/Runner/Info.plist
          # 断言：不能出现非 13.0 的部署目标
          if grep -q "IPHONEOS_DEPLOYMENT_TARGET = 12" ios/Runner.xcodeproj/project.pbxproj; then
            echo "::error::仍有 12.0 的部署目标"; exit 1
          fi

      - name: Pod install
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install --repo-update

      - name: Flutter config only
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${{ github.ref_name }}"; VER="${VER#v}"
          else
            VER="0.0.0+${GITHUB_SHA:0:7}"
          fi
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          flutter build ios --release --config-only --no-codesign \
            --dart-define=APP_VERSION="$VER"

      - name: xcodebuild archive
        working-directory: ${{ env.APP_DIR }}
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Pack IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          APP="$PWD/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP" ]; then
            APP=$(find build/ios -maxdepth 6 -name "Runner.app" -type d | head -n 1)
          fi
          echo "APP=$APP"

          # TrollStore 侧加载要求二进制具备可执行位，否则装不上
          chmod 755 "$APP/Runner" || true
          chmod -R 755 "$APP/Frameworks" 2>/dev/null || true
          find "$APP" -type f -exec sh -c '
            for f; do
              case "$(head -c 4 "$f" | od -An -tx1 | tr -d " \n")" in
                cffaedfe|cafebabe|cffaedf*) chmod 755 "$f";;
              esac
            done
          ' sh {} +

          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/Runner.app
          find build/ios/ipa/Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true
          find build/ios/ipa/Payload -name "archived-expanded-entitlements.xcent" -delete 2>/dev/null || true

          (
            cd build/ios/ipa
            ditto -c -k --sequesterRsrc --keepParent Payload "tool-plugin-${APP_VERSION}-ios-unsigned.ipa"
          )
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "build/ios/ipa/tool-plugin-${APP_VERSION}-ios-unsigned.ipa" "$GITHUB_WORKSPACE/dist/"
          ls -la "$GITHUB_WORKSPACE/dist/"
          # 记录实际部署目标，便于回溯
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" \
            "$APP/Info.plist" | tee "$GITHUB_WORKSPACE/dist/ios-min-os.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*

      - name: Release (on tag)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # 与 Android job 相同：复用 release 时 published_at 不会自动更新
      - name: 刷新发布时间
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$ID" \
            -F published_at="$NOW" >/dev/null
          echo "release $TAG 发布时间已更新为 $NOW"
